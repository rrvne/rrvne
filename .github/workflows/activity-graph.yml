name: Update Activity Graph

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: radius=16&theme=tokyo-night&area=true&hide_border=true&hide_title=false&custom_title=%F0%9D%99%8D%F0%9D%98%BC%F0%9D%99%91%F0%9D%99%80'%F0%9D%99%8E%20%F0%9D%98%BE%F0%9D%99%8A%F0%9D%99%89%F0%9D%99%8F%F0%9D%99%8D%F0%9D%99%84%F0%9D%98%BD%F0%9D%99%90%F0%9D%99%8F%F0%9D%99%84%F0%9D%99%8A%F0%9D%99%89%20%F0%9D%99%82%F0%9D%99%8D%F0%9D%98%BC%F0%9D%99%8B%F0%9D%99%83
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push activity-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: activity-graph-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
